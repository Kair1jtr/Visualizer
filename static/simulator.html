<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ヘキサうどん Visualizer</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🍜%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="./style.css" />
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="app-title">
        <h1>ヘキサうどん <span class="subtitle">Visualizer</span></h1>
        <p class="tagline">第37回全国高等専門学校プログラミングコンテスト 競技部門</p>
      </div>
      <div class="app-actions">
        <button id="btn-sample" class="btn btn-primary">サンプル試合を生成</button>
        <button id="btn-reload" class="btn" title="ライブ対戦の経過など、サーバーが保持中の試合を再生成せずに表示">現在の試合を表示</button>
        <label class="btn">
          JSONを読込
          <input type="file" id="file-input" accept="application/json,.json" hidden />
        </label>
        <a class="btn" href="./watch.html">Watch（観戦専用）</a>
      </div>
    </header>

    <main class="app-main">
      <section class="board-panel">
        <div class="board-toolbar">
          <div class="day-tabs" id="day-tabs"></div>
          <div class="zoom-controls">
            <button id="btn-zoom-out" class="btn btn-icon" title="縮小">－</button>
            <button id="btn-zoom-reset" class="btn btn-icon" title="表示リセット">⟲</button>
            <button id="btn-zoom-in" class="btn btn-icon" title="拡大">＋</button>
          </div>
        </div>
        <div class="board-wrap" id="board-wrap">
          <svg id="board-svg" xmlns="http://www.w3.org/2000/svg"></svg>
          <div id="tooltip" class="tooltip hidden"></div>
          <div id="board-empty" class="board-empty">
            <p>「サンプル試合を生成」を押すか、試合ログJSONを読み込んでください。</p>
          </div>
        </div>
        <div class="playback-bar">
          <button id="btn-play" class="btn btn-icon" title="再生 / 一時停止">▶</button>
          <input type="range" id="step-slider" min="0" max="0" value="0" step="1" disabled />
          <div class="step-readout" id="step-label">- / -</div>
          <select id="speed-select" title="再生速度">
            <option value="400">0.5×</option>
            <option value="200" selected>1×</option>
            <option value="100">2×</option>
            <option value="50">4×</option>
          </select>
        </div>
        <div class="event-ticker" id="event-ticker"></div>
      </section>

      <aside class="side-panel">
        <section class="panel-block">
          <h2>スコア</h2>
          <p class="hint">行をクリックすると盤面の在庫表示がそのチーム視点になります。</p>
          <div id="scoreboard"></div>
        </section>

        <section class="panel-block">
          <h2>詳細</h2>
          <div id="inspector">
            <p class="muted">セルやエージェントをクリックすると詳細を表示します。</p>
          </div>
        </section>

        <section class="panel-block">
          <h2>凡例</h2>
          <div id="legend"></div>
        </section>
      </aside>
    </main>

    <footer class="app-footer">
      <p>
        オフラインシミュレーター用ビジュアライザ（本番試合は
        <a href="./index.html">試合観戦</a> を参照）。形式仕様は
        <code>README.md</code> を参照。サーバー内部の確認は
        <a href="/debug">デバッグ GUI</a> へ。
      </p>
    </footer>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
