<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ヘキサうどん Visualizer</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <header class="app-header">
      <div class="app-title">
        <h1>ヘキサうどん <span class="subtitle">Visualizer</span></h1>
        <p class="tagline">第37回全国高等専門学校プログラミングコンテスト 競技部門</p>
      </div>
      <div class="app-actions">
        <button id="btn-load-sample" class="btn">サンプル試合を読込</button>
        <label class="btn btn-file">
          試合データを読込 (JSON)
          <input type="file" id="file-input" accept="application/json" hidden />
        </label>
      </div>
    </header>

    <main class="app-main">
      <section class="board-panel">
        <div class="board-toolbar">
          <div class="day-tabs" id="day-tabs"></div>
          <div class="zoom-controls">
            <button id="btn-zoom-out" class="btn btn-icon" title="縮小">－</button>
            <button id="btn-zoom-reset" class="btn btn-icon" title="表示リセット">⟲</button>
            <button id="btn-zoom-in" class="btn btn-icon" title="拡大">＋</button>
          </div>
        </div>
        <div class="board-wrap" id="board-wrap">
          <svg id="board-svg" xmlns="http://www.w3.org/2000/svg"></svg>
          <div id="tooltip" class="tooltip hidden"></div>
        </div>
        <div class="playback-bar">
          <button id="btn-play" class="btn btn-icon" title="再生 / 一時停止">▶</button>
          <input type="range" id="step-slider" min="0" max="0" value="0" step="1" />
          <div class="step-readout">
            <span id="step-label">Day - / Step -</span>
          </div>
          <select id="speed-select" title="再生速度">
            <option value="500">0.5×</option>
            <option value="250" selected>1×</option>
            <option value="120">2×</option>
            <option value="60">4×</option>
          </select>
        </div>
      </section>

      <aside class="side-panel">
        <section class="panel-block" id="legend-block">
          <h2>凡例</h2>
          <div id="legend-content"></div>
        </section>

        <section class="panel-block" id="scoreboard-block">
          <h2>スコア</h2>
          <div id="scoreboard-content"></div>
        </section>

        <section class="panel-block" id="inspector-block">
          <h2>詳細</h2>
          <div id="inspector-content">
            <p class="muted">マップ上のセル・エージェントをクリックすると詳細が表示されます。</p>
          </div>
        </section>
      </aside>
    </main>

    <footer class="app-footer">
      <p>
        本ツールは公式の通信プロトコル公開前の非公式ビジュアライザです。データ形式は
        <code>README.md</code> を参照してください。
      </p>
    </footer>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
